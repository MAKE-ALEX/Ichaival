name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel in progress runs for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # compileSdk is 36, make sure the platform is present
          packages: 'platforms;android-36'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew is committed without the executable bit, so make it runnable here
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Show toolchain
        run: |
          java -version
          ./gradlew --no-daemon --version

      - name: Assemble debug
        run: |
          set -o pipefail
          if ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build-debug.log; then
            echo "assembleDebug succeeded"
          else
            # Gradle logs can only be downloaded with a token, so surface the useful
            # part (failure + compile errors) as an annotation. GitHub truncates
            # annotations to ~4k chars, so pick the relevant lines only.
            node -e "const fs=require('fs');const raw=fs.readFileSync('build-debug.log','utf8');const lines=raw.split(/\r?\n/);const noStack=lines.filter(l=>!/^\s+at /.test(l));const i=noStack.findIndex(l=>l.includes('FAILURE: Build failed'));const picked=i>=0?noStack.slice(i,i+40):noStack.slice(-40);const errs=lines.filter(l=>/^e: /.test(l)).slice(0,15);const body=[...picked,'--- compile errors ---',...errs].join('\n').slice(0,3900);console.log('::error title=assembleDebug failed::'+body.replace(/%/g,'%25').replace(/\r/g,'').replace(/\n/g,'%0A'))"
            exit 1
          fi

      # Also compile the release variant so R8/resource shrinking is exercised
      - name: Assemble release
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-*.log
          if-no-files-found: ignore
