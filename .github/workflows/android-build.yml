name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel in progress runs for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # compileSdk is 36, make sure the platform is present
          packages: 'platforms;android-36'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew is committed without the executable bit, so make it runnable here
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble debug
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      # Also compile the release variant so R8/resource shrinking is exercised
      - name: Assemble release
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
