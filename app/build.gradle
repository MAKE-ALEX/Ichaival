plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.3.21'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
android {

    boolean doSign = keystorePropertiesFile.exists()

    if (doSign) {
        def keystoreProperties = new Properties()

        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

        signingConfigs {
            config {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    compileSdk = 36
    defaultConfig {
        applicationId "com.utazukin.ichaival"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 50
        versionName "1.11.1"
        vectorDrawables {
            useSupportLibrary true
        }
    }
    buildTypes {
        release {
            if (doSign) {
                signingConfig signingConfigs.config
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // libjxl, brotli and the animation decoders ship native libraries for four ABIs, and most
    // of the download is those .so files. Phones are ARM only, so drop the x86 builds and split
    // what is left per ABI: a 64 bit phone then downloads just its own set. The universal APK
    // keeps the arm64-v8a and armeabi-v7a libraries together for sideloading one file.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility = 17
        targetCompatibility = 17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packagingOptions {
        resources {
            pickFirsts += ['META-INF/atomicfu.kotlin_module']
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        //The ABI split scopes the per ABI APKs but the universal one is assembled from every
        //ABI present, so drop the x86 libraries here as well to keep it ARM only too
        jniLibs {
            excludes += ['lib/x86/**', 'lib/x86_64/**']
        }
    }

    androidResources {
        generateLocaleConfig true
    }

    namespace 'com.utazukin.ichaival'
    buildFeatures {
        compose true
    }
}

// jxl-coder 2.6.1 pulls androidx.core:core-ktx 1.18.0, whose manifest declares
// minSdkVersion 23; this app still supports API 21, so the manifest merger fails
// with "uses-sdk:minSdkVersion 21 cannot be smaller than version 23". 1.17.0 is
// the last release of these two artifacts that keeps minSdkVersion 21, and
// jxl-coder only touches Kotlin stdlib collections, so pin them. Other
// androidx.core artifacts (core-viewtree, released after 1.18.0) are left alone.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'androidx.core' &&
                (details.requested.name == 'core' || details.requested.name == 'core-ktx')) {
            details.useVersion '1.17.0'
            details.because 'androidx.core:core-ktx 1.18.0 raised minSdkVersion to 23, this app supports API 21'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation "androidx.constraintlayout:constraintlayout-compose:1.1.1"
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutine_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutine_version"
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view:3.10.0'
    implementation 'com.github.seven332.Image:singlelib:a7b102262a'
    implementation "androidx.room:room-runtime:$room_version"
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation platform('androidx.compose:compose-bom:2025.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    ksp "androidx.room:room-compiler:$room_version"
    implementation "androidx.paging:paging-runtime-ktx:3.3.6"
    implementation "android.arch.lifecycle:extensions:1.1.1"
    implementation "android.arch.lifecycle:viewmodel:1.1.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.4"
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation "androidx.fragment:fragment-ktx:1.8.9"
    implementation "com.squareup.okhttp3:okhttp:5.3.2"
    implementation "androidx.room:room-paging:$room_version"
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation "io.coil-kt.coil3:coil:$coil_version"
    implementation "io.coil-kt.coil3:coil-gif:$coil_version"
    implementation "io.coil-kt.coil3:coil-compose:$coil_version"
    implementation "io.coil-kt.coil3:coil-network-okhttp:$coil_version"
    // JPEG XL support for Coil (bundles libjxl native libs, requires Coil 3 since 2.4.0)
    implementation 'io.github.awxkee:jxl-coder-coil:2.6.1'
    implementation "com.drakeet.drawer:drawer:1.0.3"
    implementation 'com.github.penfeizhou.android.animation:awebp:3.0.5'
}
